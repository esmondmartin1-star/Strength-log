<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Six-month strength, running and nutrition tracker.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strength">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Strength log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --ink:#161B22; --muted:#5B6572; --line:#D5D9DF; --line-strong:#B9C0C9;
  --accent:#2848E8; --accent-ink:#FFFFFF; --accent-soft:#E3E8FD;
  --ok:#18855A; --ok-ink:#FFFFFF; --warn:#B7791F; --warn-ink:#FFFFFF; --bad:#B4321F;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141A; --surface:#181E26; --ink:#E9EDF2; --muted:#98A2AF; --line:#2B3441; --line-strong:#3D4859;
    --accent:#7C93FF; --accent-ink:#0B1020; --accent-soft:#232C4D;
    --ok:#43C08A; --ok-ink:#06180F; --warn:#E3B04B; --warn-ink:#1A1204; --bad:#F07F6A;
  }
}
:root[data-theme="dark"]{
  --bg:#10141A; --surface:#181E26; --ink:#E9EDF2; --muted:#98A2AF; --line:#2B3441; --line-strong:#3D4859;
  --accent:#7C93FF; --accent-ink:#0B1020; --accent-soft:#232C4D;
  --ok:#43C08A; --ok-ink:#06180F; --warn:#E3B04B; --warn-ink:#1A1204; --bad:#F07F6A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
#app{max-width:680px;margin:0 auto;padding:0 16px 150px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;letter-spacing:.01em}
h2{font-size:26px;margin:30px 0 10px}
h3{font-size:20px;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 4px}
.top h1{font-size:22px}
.sync{font-size:13px;color:var(--muted)}

.hero{display:flex;gap:18px;align-items:flex-end;padding:14px 0 6px}
.hero .big{font-size:104px;line-height:.8;font-weight:700;color:var(--accent)}
.hero .ht{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05}
.hero .hp{font-size:17px;font-weight:600;margin-top:2px}
.strip{display:flex;gap:3px;align-items:flex-end;height:26px;margin:8px 0 4px}
.wkbar{flex:1;background:var(--line);height:100%;border-radius:2px;position:relative}
.wkbar.past{background:var(--ink)}
.wkbar.now{background:var(--accent)}
.wkbar.dl{height:55%}
.wkbar.test::after{content:"";position:absolute;left:50%;top:-7px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--warn)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.panel.flag{border-left:5px solid var(--accent)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.stack>*+*{margin-top:10px}

.btn{min-height:44px;padding:10px 18px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600;cursor:pointer;min-height:40px}

.sg{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden}
.sg button{border:0;background:transparent;padding:8px 12px;min-height:40px;font-weight:600;cursor:pointer;border-left:1px solid var(--line)}
.sg button:first-child{border-left:0}
.sg button.on-2{background:var(--ok);color:var(--ok-ink)}
.sg button.on-1{background:var(--warn);color:var(--warn-ink)}
.sg button.on-0{background:var(--muted);color:var(--surface)}
.sg button.on{background:var(--ink);color:var(--bg)}


.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:14px;color:var(--muted);margin-bottom:3px}
.field input,.field textarea,.field select{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.four span{display:block;font-size:12px;color:var(--muted)}
.four input{width:100%;min-height:40px;padding:4px 8px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);font-family:var(--display);font-size:20px}

.knee{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.knee button{min-height:38px;border:1.5px solid var(--line-strong);background:transparent;border-radius:6px;font-weight:600;cursor:pointer;padding:0}
.knee button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.knee button.hot{background:var(--bad);color:#fff;border-color:var(--bad)}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.days div{padding:8px 0;border:1px solid var(--line);border-radius:6px;font-size:13px}
.days .t{outline:2px solid var(--accent);outline-offset:0}
.days b{display:block;font-family:var(--display);font-size:17px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);vertical-align:middle}
.dot.f{background:var(--accent);border-color:var(--accent)}
.dot.sq{border-radius:3px}
.dot.sq.f{background:var(--ok);border-color:var(--ok)}

.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--ink);margin:0 6px 4px 0}
.chip.up{background:var(--ok);color:var(--ok-ink)}
.chip.g{background:var(--warn);color:var(--warn-ink)}
.chipbtn{border:1.5px solid var(--line-strong);background:transparent;border-radius:99px;padding:6px 12px;min-height:36px;font-size:14px;font-weight:600;cursor:pointer;margin:0 6px 6px 0}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{border-left:4px solid var(--warn);padding:2px 0 2px 10px;font-size:14px;margin:8px 0}

.sessbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}
.sessbar button{min-height:46px;border:1.5px solid var(--line-strong);background:transparent;border-radius:8px;font-family:var(--display);font-size:18px;font-weight:600;cursor:pointer}
.sessbar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.ex{margin:14px 0}
.ex .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex .tg{font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.set{display:grid;grid-template-columns:52px 1fr 1fr;gap:10px;align-items:center;margin-top:8px}
.plate{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink);
  background:radial-gradient(circle at center,var(--surface) 0 44%,var(--line-strong) 45% 100%)}
.plate[aria-pressed="true"]{background:radial-gradient(circle at center,var(--surface) 0 44%,var(--accent) 45% 100%)}
.cell{position:relative}
.cell input{width:100%;min-height:48px;padding:6px 44px 6px 12px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.cell em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted);pointer-events:none}

.pk{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:14px}
.scroll{overflow-x:auto}
ul.plain{padding-left:18px;margin:6px 0 10px}
ul.plain li{margin:3px 0}
textarea.mono{width:100%;min-height:210px;padding:10px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:14px;line-height:1.45}

#rest{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:6}
#rest .in{max-width:680px;margin:0 auto;background:var(--ink);color:var(--bg);padding:10px 16px 12px}
#rest .rr{display:flex;align-items:center;justify-content:space-between;gap:10px}
#restT{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
#rest .rb{height:5px;background:rgba(127,127,127,.4);margin-top:6px;border-radius:3px;overflow:hidden}
#restBar{height:100%;width:0;background:var(--accent)}
#rest button{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:8px;min-height:40px;padding:6px 12px;font-weight:600;cursor:pointer}

#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line-strong);z-index:7;padding-bottom:env(safe-area-inset-bottom)}
#nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{min-height:58px;border:0;background:transparent;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-top:4px solid transparent}
#nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.hero .big{font-size:84px}.set{grid-template-columns:48px 1fr 1fr;gap:8px}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1>Strength log</h1><span class="sync" id="sync">Saved on this device</span></header>
  <main id="main"></main>
</div>
<div id="rest" hidden><div class="in"><div class="rr"><div><div class="small" id="restLbl">Rest</div><div id="restT">0:00</div></div><div><button data-action="rest-add">+30s</button> <button data-action="rest-skip">Skip</button></div></div><div class="rb"><div id="restBar"></div></div></div></div>
<nav id="nav" aria-label="Sections"><div class="in">
  <button data-view="today">Today</button><button data-view="train">Train</button><button data-view="progress">Progress</button><button data-view="checkin">Check-in</button><button data-view="plan">Plan</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

  {id:'curl',g:'Shoulders and arms',ss:'C',name:'Dumbbell biceps curl',sets:3,reps:[10,12],rest:20,kind:'db',step:1,cue:'Elbows still, slow on the way down.'},
  {id:'calf',g:'Calves and shins',ss:'C',name:'Standing dumbbell calf raise',sets:3,reps:[12,15],rest:60,kind:'db',step:2,cue:'Full stretch at the bottom, pause at the top.'},

};
var EXTRA=[
 {id:'abductor',g:'Glutes',name:'Seated hip abduction machine (outer hips)',sets:3,reps:[12,15],rest:60,kind:'machine',step:5,cue:'Lean slightly forward to bias the glutes, drive out, pause, control back.'},
 {id:'hyper',g:'Glutes',name:'Back extension bench (glute focus)',sets:3,reps:[10,15],rest:75,kind:'one',step:2,cue:'Round the upper back slightly, hips do the work, squeeze the glutes to rise.'},

function fmtShort(k){return parseKey(k).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}

function phaseOf(w){
  if(w<1)return {name:'Before start',rule:'Train on the planned days now if you like. Week 1 begins on your start date.'};
  if(w<=6)return {name:'Foundation',rule:'Stop every set with 3 reps left. Learn the movements and keep the knee pain-free.'};
  if(w<=18)return {name:'Build',rule:'Stop with 1 to 2 reps left. Chase the top of each rep range, then add weight.'};

}

function parseDur(v){

  if(v.indexOf(':')>-1){var p=v.split(':').map(Number);if(p.some(isNaN))return null;if(p.length===2)return p[0]*60+p[1];if(p.length===3)return p[0]*3600+p[1]*60+p[2];return null;}

function migrate(st){
  if((st.v||1)<3){
    if(st.prog){
      SIDS.forEach(function(sid){
        var pr=st.prog[sid];if(!pr||!pr.ex)return;

          if(!nid)return e;
          if(pr.ex.some(function(x){return x.id===nid;}))return e;
          var lib=null;LIB.forEach(function(x){if(x.id===nid)lib=x;});
          return lib?clone(lib):e;
        });

    }

      SIDS.forEach(function(sid){

        else{pr.ex.forEach(function(e){var lb=null;LIB.forEach(function(x){if(x.id===e.id)lb=x;});if(lb){e.name=lb.name;if(lb.aka)e.aka=lb.aka;}});}
      });
    }
    st.v=4;st.updatedAt=Date.now();
  }
  if((st.v||1)<5){
    if(st.prog){
      SIDS.forEach(function(sid){
        var pr=st.prog[sid];if(!pr||!pr.ex)return;
        pr.ex=pr.ex.map(function(e){
          if(e.id!=='machrow')return e;
          if(pr.ex.some(function(x){return x.id==='incrow';}))return e;
          var lb=null;LIB.forEach(function(x){if(x.id==='incrow')lb=x;});
          return lb?clone(lb):e;
        });
      });
    }
    st.v=5;st.updatedAt=Date.now();
  }
  if((st.v||1)<6){
    if(st.prog){
      SIDS.forEach(function(sid){
        var pr=st.prog[sid];if(!pr||!pr.ex)return;
        pr.ex=pr.ex.map(function(e){
          if(e.id!=='chestrow')return e;
          if(pr.ex.some(function(x){return x.id==='bentrow';}))return e;
          var lb=null;LIB.forEach(function(x){if(x.id==='bentrow')lb=x;});
          return lb?clone(lb):e;
        });
      });

  }
  if((st.v||1)<7){
    var V7={abductor:'sideabd',hyper:'sumo',assistpu:'latpmu'};
    if(st.prog){
      SIDS.forEach(function(sid){
        var pr=st.prog[sid];if(!pr||!pr.ex)return;
        pr.ex=pr.ex.map(function(e){
          var nid=V7[e.id];if(!nid)return e;
          if(pr.ex.some(function(x){return x.id===nid;}))return e;
          var lb=null;LIB.forEach(function(x){if(x.id===nid)lb=x;});
          return lb?clone(lb):e;
        });
      });

    st.v=7;st.updatedAt=Date.now();
  }
  if((st.v||1)<8){
    /* v8: bodyweight, waist, food, water and the daily log are removed and their stored data deleted.
       updatedAt is deliberately NOT bumped, so a stale device cannot overwrite newer account data. */
    delete st.days;delete st.targets;
    if(st.base){delete st.base.weight;delete st.base.waist;}
    if(st.checks)Object.keys(st.checks).forEach(function(k){delete st.checks[k].bw;delete st.checks[k].waist;});

function prevFor(exId,before){
  var ks=Object.keys(state.sessions).filter(function(k){return k<before;}).sort().reverse();
  for(var i=0;i<ks.length;i++){var s=state.sessions[ks[i]];var arr=(s.sets&&s.sets[exId])||[];var dn=arr.filter(function(x){return x.d;});if(dn.length)return {date:ks[i],sets:dn};}
  return null;
}
function ready(ex,prev){return !!prev&&ex.kind!=='bw'&&prev.sets.length>=ex.sets&&prev.sets.every(function(s){return (+s.r||0)>=ex.reps[1];});}
function prefill(ex,i,prev){
  if(ex.kind==='bw')return {w:'',r:prev?prev.sets[Math.min(i,prev.sets.length-1)].r:ex.reps[0]};
  if(prev){var s=prev.sets[Math.min(i,prev.sets.length-1)];var rd=ready(ex,prev);return {w:rd&&s.w!==''?round1(Math.max(0,(+s.w||0)+ex.step)):s.w,r:rd?ex.reps[0]:s.r};}
  return {w:'',r:ex.reps[0]};
}
function buildSets(date,sid){
  var wk=weekNum(date),out={};
  prog(sid).ex.forEach(function(ex,idx){
    var prev=prevFor(ex.id,date),n=setsFor(ex,idx,wk),arr=[];
    for(var i=0;i<n;i++){var p=prefill(ex,i,prev);arr.push({w:p.w,r:p.r,d:0});}
    out[ex.id]=arr;
  });
  return out;
}
function ensureSession(date,sid){
  var s=state.sessions[date];
  if(!s){s=state.sessions[date]={sid:sid,sets:buildSets(date,sid),t0:null,t1:null,done:false,rpe:'',note:''};}
  else{var b=buildSets(date,s.sid);Object.keys(b).forEach(function(k){if(!s.sets[k])s.sets[k]=b[k];});}
  return s;
}
function sessionSets(date,sid){
  var b=buildSets(date,sid),s=state.sessions[date];
  if(s&&s.sid===sid)Object.keys(s.sets).forEach(function(k){b[k]=s.sets[k];});
  return b;
}
function syncCount(date,sid,ex){
  var s=state.sessions[date];if(!s||s.sid!==sid||!s.sets[ex.id])return;
  var idx=0;prog(sid).ex.forEach(function(e,i){if(e.id===ex.id)idx=i;});
  var n=setsFor(ex,idx,weekNum(date)),arr=s.sets[ex.id];
  while(arr.length<n){var l=arr[arr.length-1]||{w:'',r:ex.reps[0]};arr.push({w:l.w,r:l.r,d:0});}
  while(arr.length>n&&!arr[arr.length-1].d)arr.pop();
}
function prsFor(date){
  var s=state.sessions[date],out=[];if(!s)return out;
  Object.keys(s.sets).forEach(function(id){
    var ex=findEx(id);if(!ex)return;
    var sets=s.sets[id].filter(function(x){return x.d;});if(!sets.length)return;
    var key=ex.kind==='bw'?'r':'w';
    var best=Math.max.apply(null,sets.map(function(x){return +x[key]||0;}));
    var prior=0;
    Object.keys(state.sessions).forEach(function(k){if(k>=date)return;((state.sessions[k].sets||{})[id]||[]).forEach(function(x){if(x.d)prior=Math.max(prior,+x[key]||0);});});
    if(prior>0&&best>prior)out.push(ex.name+': '+best+(key==='r'?(ex.ru?' '+ex.ru:' reps'):' kg')+' (was '+prior+')');
  });
  return out;
}

/* ---------- Focus volume ---------- */
function focusPlan(){
  var o={};GROUPS.forEach(function(g){o[g]=0;});
  SIDS.forEach(function(s){prog(s).ex.forEach(function(e){o[e.g||'Push']=(o[e.g||'Push']||0)+e.sets;});});
  return o;
}
function focusDone(mon){
  var o={};GROUPS.forEach(function(g){o[g]=0;});
  for(var i=0;i<7;i++){var s=state.sessions[addDays(mon,i)];if(!s)continue;
    Object.keys(s.sets).forEach(function(id){var ex=findEx(id);if(!ex)return;var n=s.sets[id].filter(function(x){return x.d;}).length;o[ex.g||'Push']=(o[ex.g||'Push']||0)+n;});}
  return o;
}

/* ---------- Week stats and coach signals ---------- */
function weekStats(mon){
  var st={sessions:0,missed:[]};
  for(var i=0;i<7;i++){
    var k=addDays(mon,i),sid=DOW[parseKey(k).getDay()],s=state.sessions[k];
    if(hasDone(s))st.sessions++;else if(sid&&k<today())st.missed.push(prog(sid).name);
  }
  return st;
}
function avg(a){return a.length?round1(a.reduce(function(x,y){return x+y;},0)/a.length):null;}
function cardioStats(mon){
  var e=(state.cardio||[]).filter(function(x){return x.date>=mon&&x.date<=addDays(mon,6);});
  var o={runs:0,runKm:0,runSec:0,swims:0,swimM:0,runKnee:[],all:e.length};
  e.forEach(function(x){
    if(x.type==='run'){o.runs++;o.runKm+=(+x.dist||0);o.runSec+=(+x.sec||0);if(x.knee!=null&&x.knee!=='')o.runKnee.push(+x.knee);}
    else{o.swims++;o.swimM+=(+x.dist||0);}
  });
  o.runKm=round1(o.runKm);return o;
}
function signals(mon){
  var out=[],st=weekStats(mon),c=state.checks[mon]||{};
  if(st.sessions<3)out.push('Only '+st.sessions+' of 4 sessions logged. Name the slot that failed and give it a fixed time next week.');
  var fd=focusDone(mon);
  if(st.sessions>=3&&fd.Glutes<12)out.push('Only '+fd.Glutes+' glute sets this week. Add a glute finisher to an upper day, such as frog pumps or side-lying abduction.');
  var sl=(c.sleep!==''&&c.sleep!=null)?+c.sleep:null;
  if(sl!=null&&sl<6.5)out.push('Sleep averages '+sl+' h. Recovery is your limiter: move lights-out 30 minutes earlier before adding any training.');
  var kn=(c.knee!==''&&c.knee!=null)?+c.knee:null;
  if(kn!=null&&kn>=4)out.push('Knee pain averages '+kn+'/10. Hold depth and load on lower days and raise it with your physio before progressing.');
  var cs=cardioStats(mon);
  if(weekNum(mon)>=1&&mon<mondayKey(today())&&cs.all===0)out.push('No run or swim logged. Two easy sessions a week is the target, and swimming counts.');
  var rk=avg(cs.runKnee);
  if(rk!=null&&rk>=4)out.push('Knee scored '+rk+'/10 after runs. Swap runs for swims or brisk walks until your physio agrees to progress running.');
  return out;
}
function summaryText(mon){
  var c=state.checks[mon]||{},wk=weekNum(mon),st=weekStats(mon),ph=phaseOf(wk);
  var L=[];
  L.push('Week '+wk+' of 26 ('+ph.name+(isDeload(wk)?', deload':'')+') check-in, '+fmtShort(mon)+' to '+fmtShort(addDays(mon,6)));
  L.push('Sessions: '+st.sessions+' of 4'+(st.missed.length?' (missed: '+st.missed.join(', ')+')':''));
  var fd=focusDone(mon);
  L.push('Sets done: glutes '+fd.Glutes+', knee and quads '+fd['Knee and quads']+', hamstrings '+fd.Hamstrings+', push '+fd.Push+', pull '+fd.Pull);
  var sl=(c.sleep!==''&&c.sleep!=null)?c.sleep:null,kn=(c.knee!==''&&c.knee!=null)?c.knee:null;
  L.push('Sleep average: '+(sl!=null?sl+' h':'n/a')+'. Energy: '+(c.energy?c.energy+'/5':'n/a')+'. Knee pain average: '+(kn!=null?kn+'/10':'n/a'));
  var cs=cardioStats(mon),rkn=avg(cs.runKnee);
  L.push('Cardio: '+cs.runs+' runs ('+cs.runKm+' km'+(cs.runKm>0&&cs.runSec>0?', average pace '+fmtTime(cs.runSec/cs.runKm)+'/km':'')+'), '+cs.swims+' swims ('+Math.round(cs.swimM)+' m)'+(rkn!=null?'. Knee after runs: '+rkn+'/10':''));
  var tops=[];
  for(var i=0;i<7;i++){var s=state.sessions[addDays(mon,i)];if(!hasDone(s))continue;
    Object.keys(s.sets).forEach(function(id){var ex=findEx(id);if(!ex)return;var dn=s.sets[id].filter(function(x){return x.d;});if(!dn.length)return;
      var t=dn.reduce(function(a,b){return ((+b.w||0)>(+a.w||0)||((+b.w||0)===(+a.w||0)&&(+b.r||0)>(+a.r||0)))?b:a;});
      tops.push(ex.name+' '+(ex.kind==='bw'?t.r+(ex.ru?' '+ex.ru:' reps'):(t.w||0)+'kg x '+t.r));});}
  if(tops.length)L.push('Top sets: '+tops.join('; '));
  if(c.win)L.push('Win: '+c.win);
  if(c.snag)L.push('What got in the way: '+c.snag);
  if(c.ask)L.push('Question: '+c.ask);
  return L.join('\n');
}

/* ---------- Charts ---------- */
function chart(pts,o){
  o=o||{};
  if(!pts.length)return '<p class="muted small">Nothing logged yet.</p>';
  var W=320,H=150,pl=36,pr=10,pt=12,pb=22;
  var ys=pts.map(function(p){return p.y;});if(o.goal!=null)ys.push(o.goal);
  var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);if(mn===mx){mn-=1;mx+=1;}
  var pd=(mx-mn)*0.15;mn-=pd;mx+=pd;
  var ts=pts.map(function(p){return p.t;}),t0=Math.min.apply(null,ts),t1=Math.max.apply(null,ts);if(t0===t1)t1=t0+1;
  function X(t){return pts.length===1?pl+(W-pl-pr)/2:pl+(t-t0)/(t1-t0)*(W-pl-pr);}
  function Y(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(o.label||'Chart')+'">';
  [mn+pd,(mn+mx)/2,mx-pd].forEach(function(v){
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/>';
    s+='<text x="'+(pl-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--muted)">'+(o.fmt?o.fmt(v):round1(v))+'</text>';
  });
  if(o.goal!=null)s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(o.goal).toFixed(1)+'" y2="'+Y(o.goal).toFixed(1)+'" stroke-dasharray="4 4" style="stroke:var(--warn)" stroke-width="1.5"/><text x="'+(W-pr)+'" y="'+(Y(o.goal)-4).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--warn)">goal '+o.goal+'</text>';
  s+='<path d="'+d+'" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(p){s+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.5" style="fill:var(--surface);stroke:var(--accent)" stroke-width="2"/>';});
  s+='<text x="'+pl+'" y="'+(H-5)+'" font-size="10" style="fill:var(--muted)">'+fmtShort(dkey(new Date(t0)))+'</text>';
  if(pts.length>1)s+='<text x="'+(W-pr)+'" y="'+(H-5)+'" text-anchor="end" font-size="10" style="fill:var(--muted)">'+fmtShort(dkey(new Date(t1)))+'</text>';
  return s+'</svg>';
}

  h+='<h2>Equipment</h2><div class="panel"><p style="margin:0">The plan uses dumbbells, a bench, bodyweight and five machines: leg press, leg curl, lat pulldown, chest press and shoulder press. Cable exercises are still in the library under the Cable filter for when a station is free, and your earlier cable history is kept. Machine weights are in kg on the stack, so use the smallest pin step your machine allows when you progress.</p></div>';

  h+='<h2>Planned sets per week</h2><div class="panel scroll"><table><tr><th>Group</th><th>Sets</th></tr>'+GROUPS.map(function(g){return '<tr><td>'+g+'</td><td>'+fp[g]+'</td></tr>';}).join('')+'</table><p class="small muted" style="margin:10px 0 0">Aim for 15 to 20 glute sets, 10 to 12 knee and quad sets, and 12 to 18 sets each for push and pull. This updates as you edit the plan.</p></div>';
  h+='<h2>Glute and knee focus</h2><div class="panel"><ul class="plain"><li><b>Glutes get the most volume.</b> Hip thrusts, hinges, sumo deadlifts, side-lying leg raises and single-leg work appear on both lower days.</li><li><b>Knee strength is built without deep bend.</b> Leg press to a set depth stop and wall sits train the quads in a pain-free range, and the leg curl builds hamstring support. The goblet box squat is in the library if you want it back. Step-ups and other loaded knee work are physio-gated.</li><li><b>Progress in this order:</b> time under tension, then reps, then load, then depth. Depth only moves with your physio\u2019s approval.</li><li><b>Tempo.</b> 3 seconds down on knee exercises, 1 second pause at the top of glute exercises.</li><li>Log a knee score after every run and in the weekly check-in, and keep it honest. It drives the signals on the Check-in tab.</li></ul></div>';
  h+='<h2>Running and swimming</h2><div class="panel"><ul class="plain"><li><b>Two easy sessions a week.</b> One run and one swim, at conversation pace. This builds your aerobic base without eating into muscle gain.</li><li><b>Running builds gradually.</b> Weeks 1 to 5 are 25 easy minutes, then 30 minutes from week 7 and 35 from week 19. Time trials replace the easy run in retest weeks (6, 12, 18, 26).</li><li><b>Swim by freestyle or pull buoy.</b> Avoid the breaststroke kick unless your physio is happy with it. Swimming is your low-impact swap whenever the knee is sore.</li><li><b>Knee rule for runs.</b> Above 3 out of 10 during a run, stop and walk. If the knee scores 4 or more after two runs in a row, swap runs for swims and tell your physio.</li><li><b>Fuel it.</b> Add a banana or one extra carb portion on run and swim days. It costs roughly 250 to 350 kcal a session, which is small against your surplus.</li><li><b>Recovery.</b> Avoid running the day before a lower-body session if the legs feel heavy. Move the run day in Settings if needed.</li></ul></div>';
  h+='<h2>Phases</h2><div class="panel"><ul class="plain"><li><b>Foundation, weeks 1 to 6.</b> 3 reps in reserve, technique, pain-free knee range, glute activation. Deload and retest in week 6.</li><li><b>Build, weeks 7 to 18.</b> 1 to 2 reps in reserve. The first two exercises of each session gain a set. Deloads and retests in weeks 12 and 18.</li><li><b>Strength, weeks 19 to 26.</b> Main lifts move to 6 to 8 reps. Deload in week 24, final retest in week 26.</li></ul></div>';
  h+='<h2>Progression rules</h2><div class="panel"><ul class="plain"><li><b>Double progression.</b> When every set reaches the top of the rep range with clean form, the app flags "Add weight today" next session.</li><li>Miss the bottom of the range two sessions in a row: drop the weight 10% and rebuild.</li><li><b>Knee traffic light.</b> 0 to 3 out of 10 during training and settled by the next morning: carry on. 4 or more, swelling, or catching: stop that movement and tell your physio. Confirm these limits with them.</li></ul></div>';
  h+='<h2>Fuel</h2><div class="panel"><p><b>Targets, without counting calories.</b> About 155 g protein a day, spread over five eating moments, and a small surplus of roughly 300 kcal above maintenance. Aim for 0.2 to 0.35 kg gain a week.</p><ul class="plain"><li><b>Plate rule at lunch and dinner.</b> Two palms of fish, eggs or tofu, two fists of carbs (rice, pasta, potato, bread), one to two fists of vegetables, one thumb of oil or nuts.</li><li><b>Weight flat for two weeks:</b> add one fist of carbs at dinner and a banana in the afternoon. <b>Above 0.5 kg a week:</b> remove the afternoon carb.</li><li><b>Breakfast, fixed and fast.</b> Eggs on toast, or Greek yogurt with oats and banana, or bran flakes with milk plus a Greek yogurt. Training mornings: banana and coffee before, breakfast within 90 minutes after.</li><li><b>Fix the hunger dips.</b> Mid-morning and mid-afternoon each get a two-minute item you can eat while working: a milk and pea protein shake, a Greek yogurt or skyr pot, two boiled eggs, hummus with oatcakes, sardines on crackers. Block 10 minutes in your calendar at 10:30 and 16:00, and set alarms.</li><li><b>Lunch.</b> Salmon and salad plus a carb. Rotate prawns, eggs or tofu two days a week for variety.</li><li><b>Dinner, 8:30 to 9 pm.</b> Keep the two current preps and add two more: miso salmon with rice and greens, and prawn and egg fried rice or baked cod with lentils.</li><li><b>Prep.</b> Sunday 45 minutes: dinners, boiled eggs, overnight oats, snack boxes. Wednesday 30 minutes: top up dinners and snacks.</li><li><b>Optional supplements.</b> No whey. A pea protein powder, one scoop a day at mid-morning, is a convenience only, because food alone can hit your protein. Creatine monohydrate 3 to 5 g daily. Check with your doctor if you have any health conditions.</li></ul></div>';
  h+='<h2>Settings</h2><div class="panel"><div class="two"><label class="field"><span>Programme start date</span><input type="date" data-set="startDate" value="'+esc(state.startDate)+'"></label><div></div></div>';
  h+='<div class="two"><label class="field"><span>Baseline 5 km</span><input data-set="b5" value="'+esc(state.base.fiveK)+'"></label><label class="field"><span>Baseline max push-ups</span><input data-set="bpu" inputmode="numeric" value="'+esc(state.base.pushups)+'"></label></div>';
  var dsel=function(key,cur){return '<select data-set="'+key+'">'+[['-1','Off'],['1','Monday'],['2','Tuesday'],['3','Wednesday'],['4','Thursday'],['5','Friday'],['6','Saturday'],['0','Sunday']].map(function(o){return '<option value="'+o[0]+'"'+(String(cur)===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>';};
  h+='<div class="two"><label class="field"><span>Run day</span>'+dsel('runday',state.cdays.run)+'</label><label class="field"><span>Swim day</span>'+dsel('swimday',state.cdays.swim)+'</label></div>';
  h+='<h3 style="margin-top:6px">Export your data</h3><div class="two"><button class="btn" data-action="csvw">Workouts CSV</button><button class="btn" data-action="csvcd">Run and swim CSV</button></div><div style="margin-top:10px"><button class="btn block" data-action="backup">Full backup file</button></div><div style="margin-top:10px"><button class="btn block" data-action="reset" style="border-color:var(--bad);color:var(--bad)">Erase all data</button></div></div>';
  h+='<h2>Version history</h2><div class="panel">'+CHANGES.map(function(c){return '<p style="margin:0 0 10px"><b>v'+c.v+', '+esc(c.date)+'.</b></p><ul class="plain small">'+c.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';}).join('')+'</div>';
  return h;
}

var VIEWS={today:viewToday,train:viewTrain,progress:viewProgress,checkin:viewCheckin,plan:viewPlan};
function render(){
  var y=window.scrollY;
  $('#main').innerHTML=VIEWS[view]();
  document.querySelectorAll('#nav button').forEach(function(b){if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  window.scrollTo(0,y);
}
function go(v){view=v;window.scrollTo(0,0);render();}

/* ---------- Toast, rest timer, files ---------- */
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2400);}
var rest=null,restIv=null;
function startRest(sec,label){rest={end:Date.now()+sec*1000,total:Math.max(1,sec)};$('#rest').hidden=false;$('#restLbl').textContent='Rest after '+label;clearInterval(restIv);restIv=setInterval(tickRest,250);tickRest();}
function tickRest(){
  if(!rest)return;
  var left=Math.max(0,Math.ceil((rest.end-Date.now())/1000));
  $('#restT').textContent=fmtTime(left);$('#restBar').style.width=(100*(1-left/rest.total))+'%';
  if(left<=0){clearInterval(restIv);$('#restLbl').textContent='Rest over. Next set.';try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}setTimeout(function(){if(rest&&Date.now()>=rest.end)stopRest();},8000);}
}
function stopRest(){rest=null;clearInterval(restIv);$('#rest').hidden=true;}
function csvc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function saveFile(name,data){
  var mime=/\.csv$/.test(name)?'text/csv':'application/json';
  try{
    var blob=new Blob([data],{type:mime});
    var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(ios&&navigator.canShare&&window.File){
      var f=new File([blob],name,{type:mime});
      if(navigator.canShare({files:[f]})){
        return navigator.share({files:[f],title:name}).then(function(){return true;},function(er){if(!er||er.name!=='AbortError')toast('Could not share the file');return false;});
      }
    }
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){try{document.body.removeChild(a);URL.revokeObjectURL(url);}catch(e){}},1500);
    toast('File saved to your downloads');
    return Promise.resolve(true);
  }catch(e){toast('Could not save the file');return Promise.resolve(false);}
}
function workoutsCsv(){
  var rows=[['date','session','exercise','group','set','weight_kg','reps_or_seconds','done']];
  Object.keys(state.sessions).sort().forEach(function(k){
    var s=state.sessions[k];
    Object.keys(s.sets).forEach(function(id){var ex=findEx(id);s.sets[id].forEach(function(x,i){rows.push([k,prog(s.sid).name,ex?ex.name:id,ex?ex.g:'',i+1,x.w,x.r,x.d?'yes':'no']);});});
  });
  return rows.map(function(r){return r.map(csvc).join(',');}).join('\n');
}
function cardioCsv(){
  var rows=[['date','activity','time_mm_ss','distance','distance_unit','pace','effort','knee_0_10','note']];
  (state.cardio||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(x){
    var d=+x.dist||0,pace='';
    if(x.type==='run'&&d>=1)pace=fmtTime(x.sec/d)+' per km';
    if(x.type==='swim'&&d>=100)pace=fmtTime(x.sec/(d/100))+' per 100 m';
    rows.push([x.date,x.type,fmtDur(x.sec),d,x.type==='run'?'km':'m',pace,x.rpe||'',x.knee==null?'':x.knee,x.note||'']);
  });
  return rows.map(function(r){return r.map(csvc).join(',');}).join('\n');
}

/* ---------- Events ---------- */
function confirmTwice(key){if(armedKey===key){armedKey=null;return true;}armedKey=key;toast('Tap again to confirm');setTimeout(function(){if(armedKey===key)armedKey=null;},3000);return false;}
function ciObj(){if(!state.checks[ciWeek])state.checks[ciWeek]={};return state.checks[ciWeek];}
function tmplIndex(sid,id){var a=prog(sid).ex;for(var i=0;i<a.length;i++)if(a[i].id===id)return i;return -1;}

document.addEventListener('click',function(e){
  var nb=e.target.closest('[data-view]');if(nb){go(nb.dataset.view);return;}
  var el=e.target.closest('[data-action]');if(!el)return;
  var a=el.dataset.action,t=today(),sid,ix,arr;
  if(a==='wn-close'){state.seen=APP_V;touch();render();}
  else if(a==='open'){trainDate=t;trainSid=el.dataset.sid;trainMode='strength';go('train');}
  else if(a==='tmode'){trainMode=el.dataset.m;if(trainMode==='cardio'&&!cdraft.time&&!cdraft.dist){cdraft.type=cardioOn(trainDate)[0]||cdraft.type;}render();}
  else if(a==='cardio-open'){trainDate=t;trainMode='cardio';cdraft={type:el.dataset.type||'run',time:'',dist:'',rpe:'',knee:null,note:''};go('train');}
  else if(a==='ctype'){cdraft.type=el.dataset.t;render();}
  else if(a==='ceff'){cdraft.rpe=cdraft.rpe===el.dataset.v?'':el.dataset.v;render();}
  else if(a==='cknee'){var cq=+el.dataset.v;cdraft.knee=cdraft.knee===cq?null:cq;render();}
  else if(a==='csave'){
    var csec=parseDur(cdraft.time);
    if(csec==null||csec<=0){toast('Enter a time such as 30:00');return;}
    var cdist=num(cdraft.dist);
    if(!state.cardio)state.cardio=[];
    state.cardio.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:trainDate,type:cdraft.type,sec:csec,dist:cdist===''?0:cdist,rpe:cdraft.rpe,knee:cdraft.knee,note:cdraft.note});
    var bch=document.getElementById('cbench');
    if(cdraft.type==='run'&&bch&&bch.checked){var ct0=state.tests[trainDate]||{};state.tests[trainDate]={fiveK:fmtTime(csec),pushups:ct0.pushups==null?'':ct0.pushups,wall:ct0.wall==null?'':ct0.wall,bridge:ct0.bridge==null?'':ct0.bridge};}
    cdraft={type:cdraft.type,time:'',dist:'',rpe:'',knee:null,note:''};
    touch();render();toast('Saved');
  }
  else if(a==='cdel'){if(!confirmTwice('cdel'+el.dataset.id))return;state.cardio=(state.cardio||[]).filter(function(x){return x.id!==el.dataset.id;});touch();render();}
  else if(a==='peq'){picker.eq=el.dataset.e;render();}
  else if(a==='csvcd'){saveFile('run-and-swim-'+t+'.csv',cardioCsv());}
  else if(a==='sid'){
    var s=state.sessions[trainDate],ns=el.dataset.sid;
    if(s&&s.sid!==ns){if(hasDone(s)){toast('Clear this session first to switch');return;}delete state.sessions[trainDate];touch();}
    trainSid=ns;render();
  }
  else if(a==='plate'){
    sid=effSid();var ss=ensureSession(trainDate,sid),pa=ss.sets[el.dataset.ex],st=pa&&pa[+el.dataset.i],ex=findEx(el.dataset.ex);
    if(!st)return;
    st.d=st.d?0:1;
    if(st.d){if(!ss.t0)ss.t0=Date.now();ss.done=false;startRest(ex?ex.rest:90,ex?ex.name:'set');}
    touch();render();
  }
  else if(a==='addset'){var ss2=ensureSession(trainDate,effSid());arr=ss2.sets[el.dataset.ex];if(!arr)return;var l=arr[arr.length-1]||{w:'',r:''};arr.push({w:l.w,r:l.r,d:0});touch();render();}
  else if(a==='rmset'){var ss3=ensureSession(trainDate,effSid());arr=ss3.sets[el.dataset.ex];if(arr&&arr.length>1){if(arr[arr.length-1].d){toast('Untick the last set first');return;}arr.pop();touch();render();}}
  else if(a==='rpe'){var s3=ensureSession(trainDate,effSid());s3.rpe=s3.rpe===el.dataset.v?'':el.dataset.v;touch();render();}
  else if(a==='finish'){var s4=ensureSession(trainDate,effSid());s4.done=true;s4.t1=Date.now();touch();stopRest();render();window.scrollTo(0,document.body.scrollHeight);toast('Session saved');}
  else if(a==='reopen'){var s5=state.sessions[trainDate];if(s5){s5.done=false;touch();render();}}
  else if(a==='clear'){if(!confirmTwice('clear'))return;delete state.sessions[trainDate];touch();stopRest();render();}
  else if(a==='rest-skip'){stopRest();}
  else if(a==='rest-add'){if(rest){rest.end+=30000;rest.total+=30;clearInterval(restIv);restIv=setInterval(tickRest,250);$('#restLbl').textContent='Rest';tickRest();}}
  else if(a==='edit'){editMode=!editMode;picker.mode='add';picker.target=null;render();}
  else if(a==='mvup'||a==='mvdn'){
    sid=effSid();ix=tmplIndex(sid,el.dataset.ex);var j=a==='mvup'?ix-1:ix+1;
    if(ix<0||j<0||j>=prog(sid).ex.length)return;
    arr=editable()[sid].ex;var tmp=arr[ix];arr[ix]=arr[j];arr[j]=tmp;touch();render();
  }
  else if(a==='rm'){
    sid=effSid();ix=tmplIndex(sid,el.dataset.ex);if(ix<0)return;
    var rex=clone(prog(sid).ex[ix]);state.reg[rex.id]=rex;
    editable()[sid].ex.splice(ix,1);touch();render();toast('Removed. Logged history is kept.');
  }
  else if(a==='swap'){picker={mode:'swap',target:el.dataset.ex,group:picker.group,eq:picker.eq};render();var pk=document.getElementById('picker');if(pk&&pk.scrollIntoView)pk.scrollIntoView();}
  else if(a==='pcancel'){picker.mode='add';picker.target=null;render();}
  else if(a==='pgroup'){picker.group=el.dataset.g;render();}
  else if(a==='pick'){
    sid=effSid();var lib=null;LIB.forEach(function(x){if(x.id===el.dataset.id)lib=x;});if(!lib)return;
    var nx=clone(lib);state.reg[nx.id]=nx;arr=editable()[sid].ex;
    if(picker.mode==='swap'&&picker.target){ix=tmplIndex(sid,picker.target);if(ix>-1){var old=clone(arr[ix]);state.reg[old.id]=old;arr[ix]=nx;}else arr.push(nx);}
    else arr.push(nx);
    picker={mode:'add',target:null,group:picker.group,eq:picker.eq};touch();render();toast('Plan updated');
  }
  else if(a==='custom'){
    var name=$('#cn').value.trim();if(!name){toast('Name the exercise first');return;}
    var kv=$('#ck').value,lo=num($('#cl').value)||8,hi=num($('#ch').value)||lo;if(hi<lo)hi=lo;
    var cx={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),g:$('#cg').value,name:name,sets:Math.max(1,Math.min(8,Math.round(num($('#cs').value)||3))),reps:[lo,hi],rest:kv==='bw'||kv==='time'?60:90,kind:kv==='time'?'bw':kv,step:kv==='cable'?2.5:(kv==='machine'?5:(kv==='db'||kv==='one'?2:0)),side:$('#cside').checked,cue:'Custom exercise.'};
    if(kv==='time')cx.ru='s';
    sid=effSid();state.reg[cx.id]=cx;editable()[sid].ex.push(clone(cx));touch();render();toast('Exercise added');
  }
  else if(a==='resetplan'){
    if(!confirmTwice('resetplan'))return;
    sid=effSid();editable()[sid]=clone(PROGRAM[sid]);touch();render();toast('Default plan restored');
  }
  else if(a==='savetest'){
    var f5=$('#t5').value.trim(),pu=$('#tpu').value.trim(),wl=$('#twl').value.trim(),br=$('#tbr').value.trim();
    if(!f5&&!pu&&!wl&&!br){toast('Enter at least one result');return;}
    if(f5&&parseTime(f5)==null){toast('Use mm:ss for the 5 km time');return;}
    var cur=state.tests[t]||{};
    state.tests[t]={fiveK:f5||cur.fiveK||'',pushups:pu?num(pu):(cur.pushups==null?'':cur.pushups),wall:wl?num(wl):(cur.wall==null?'':cur.wall),bridge:br?num(br):(cur.bridge==null?'':cur.bridge)};
    touch();render();toast('Benchmark saved');
  }
  else if(a==='ciprev'){ciWeek=addDays(ciWeek,-7);render();}
  else if(a==='cinext'){ciWeek=addDays(ciWeek,7);render();}
  else if(a==='energy'){var c=ciObj(),n2=+el.dataset.v;c.energy=c.energy===n2?'':n2;touch();render();}
  else if(a==='copy'){
    var ta=$('#sumTxt');ta.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(er){}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){toast('Summary copied');},function(){toast(ok?'Summary copied':'Select the text and copy it');});}
    else toast(ok?'Summary copied':'Select the text and copy it');
  }
  else if(a==='backup'){saveFile('strength-log-backup-'+t+'.json',JSON.stringify(state,null,2));}
  else if(a==='csvw'){saveFile('workouts-'+t+'.csv',workoutsCsv());}
  else if(a==='reset'){
    if(!confirmTwice('reset'))return;
    state=defaultState();state.seen=APP_V;touch();stopRest();editMode=false;render();toast('All data erased');
  }
});

document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.f){
    var f=el.dataset.f;
    if(f==='note'){var sn=ensureSession(trainDate,effSid());sn.note=el.value;touch();return;}
    var s=ensureSession(trainDate,effSid()),ar=s.sets[el.dataset.ex],st=ar&&ar[+el.dataset.i];if(!st)return;st[f]=num(el.value);touch();
  }else if(el.dataset.cd){cdraft[el.dataset.cd]=el.value;}
  else if(el.dataset.ci){
    var c=ciObj(),k=el.dataset.ci;
    c[k]=(k==='win'||k==='snag'||k==='ask')?el.value:(el.value===''?'':num(el.value));
    touch();var ta=$('#sumTxt');if(ta)ta.value=summaryText(ciWeek);
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='pex'){progEx=el.value;render();}
  else if(el.id==='tdate'){trainDate=el.value||today();trainSid=null;render();}
  else if(el.dataset.pe){
    var sid=effSid(),ix=tmplIndex(sid,el.dataset.ex);if(ix<0)return;
    var ex=editable()[sid].ex[ix],v=num(el.value),k=el.dataset.pe;if(v==='')return;
    if(k==='sets'){ex.sets=Math.max(1,Math.min(8,Math.round(v)));ex.fixed=true;}
    else if(k==='lo'){ex.reps[0]=Math.max(1,v);if(ex.reps[1]<ex.reps[0])ex.reps[1]=ex.reps[0];}
    else if(k==='hi'){ex.reps[1]=Math.max(ex.reps[0],v);}
    else if(k==='rest'){ex.rest=Math.max(0,v);}
    syncCount(trainDate,sid,ex);touch();render();
  }
  else if(el.dataset.set){
    var kk=el.dataset.set,vv=el.value;
    if(kk==='startDate'&&vv)state.startDate=vv;
    else if(kk==='b5')state.base.fiveK=vv.trim();
    else if(kk==='bpu')state.base.pushups=num(vv);
    else if(kk==='runday'){state.cdays.run=+vv;}
    else if(kk==='swimday'){state.cdays.swim=+vv;}
    touch();render();toast('Saved');
  }
});

render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
